# TheHive 6 + Cortex 4 lab stack behind nginx (HTTPS)
#
# Self-contained: no .env and no extra files needed. Just:
#   sudo sysctl -w vm.max_map_count=262144
#   docker compose up -d
# Needs Docker Compose v2.23.1 or later (inline configs).
#
# On first start, the "init" service creates a random TheHive secret and a
# self-signed certificate, both kept in Docker volumes and reused afterwards.
#
# TheHive: https://<host>        (admin@thehive.local / secret - change it)
# Cortex:  https://<host>:9443   (create the admin account on first visit)
#
# Optional .env settings (see .env.example): SERVER_NAME (name in the
# self-signed certificate), CORTEX_API_KEY, THEHIVE_SECRET, image versions.

services:
  init:
    image: alpine/openssl:3.5.8
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -s /secrets/thehive-secret ]; then
          openssl rand -hex 32 > /secrets/thehive-secret
          echo "Generated TheHive secret"
        fi
        chmod 644 /secrets/thehive-secret
        if [ ! -s /certs/server.crt ] || [ ! -s /certs/server.key ]; then
          openssl req -x509 -nodes -newkey rsa:4096 -days 825 \
            -keyout /certs/server.key -out /certs/server.crt \
            -subj "/CN=$$SERVER_NAME" \
            -addext "subjectAltName=DNS:$$SERVER_NAME,DNS:localhost"
          chmod 600 /certs/server.key
          echo "Generated self-signed certificate for $$SERVER_NAME"
        fi
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost}
    volumes:
      - secrets:/secrets
      - certs:/certs

  thehive:
    image: strangebee/thehive:${THEHIVE_VERSION:-6.0.0-2}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      cassandra:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms1280M -Xmx1280M -XX:MaxMetaspaceSize=400m -XX:ReservedCodeCacheSize=250m
      - THEHIVE_SECRET=${THEHIVE_SECRET:-}
      - CORTEX_API_KEY=${CORTEX_API_KEY:-}
    # Wraps the image entrypoint: secret from .env or from the init volume,
    # Cortex connector only when CORTEX_API_KEY is set
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        SECRET="$${THEHIVE_SECRET:-$$(cat /secrets/thehive-secret)}"
        set -- --secret "$$SECRET" --cql-hostnames cassandra --es-hostnames elasticsearch --storage-directory /data/files
        if [ -n "$$CORTEX_API_KEY" ]; then
          set -- "$$@" --cortex-hostnames cortex --cortex-keys "$$CORTEX_API_KEY"
        fi
        exec /opt/thehive/entrypoint "$$@"
    volumes:
      - thehivedata:/data/files
      - secrets:/secrets:ro
    networks:
      - SOC_NET

  cassandra:
    image: cassandra:${CASSANDRA_VERSION:-4.1.12}
    restart: unless-stopped
    environment:
      - CASSANDRA_CLUSTER_NAME=TheHive
      - CASSANDRA_NUM_TOKENS=4
      - MAX_HEAP_SIZE=1024M
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandradata:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      start_period: 120s
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - SOC_NET

  elasticsearch:
    image: elasticsearch:${ELASTICSEARCH_VERSION:-8.19.25}
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.name=hive
      - http.host=0.0.0.0
      - thread_pool.search.queue_size=100000
      - thread_pool.write.queue_size=100000
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearchdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cat/health || exit 1"]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - SOC_NET

  cortex:
    image: thehiveproject/cortex:${CORTEX_VERSION:-4.2.0}
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - es_uri=http://elasticsearch:9200
      - job_directory=/tmp/cortex-jobs
      - docker_job_directory=/tmp/cortex-jobs
    volumes:
      # Cortex runs analyzers/responders as Docker containers
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/cortex-jobs:/tmp/cortex-jobs
      - cortexlogs:/var/log/cortex
    networks:
      - SOC_NET

  nginx:
    image: nginx:${NGINX_VERSION:-1.31.9}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      thehive:
        condition: service_started
      cortex:
        condition: service_started
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      # Own certificate: docker compose cp server.crt nginx:/etc/nginx/certs/server.crt
      # (same for server.key), then docker compose restart nginx
      - certs:/etc/nginx/certs
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:9443:9443"
    networks:
      - SOC_NET

configs:
  nginx_conf:
    content: |
      # TheHive on 443, Cortex on 9443, port 80 redirects to HTTPS
      server {
          listen 80 default_server;
          server_name _;
          return 301 https://$$host$$request_uri;
      }

      server {
          listen 443 ssl default_server;
          http2 on;
          server_name _;

          ssl_certificate     /etc/nginx/certs/server.crt;
          ssl_certificate_key /etc/nginx/certs/server.key;
          ssl_protocols       TLSv1.2 TLSv1.3;
          ssl_session_cache   shared:SSL:1m;
          ssl_session_timeout 10m;

          client_max_body_size 2G;
          proxy_buffering off;
          proxy_read_timeout 600;
          proxy_send_timeout 600;

          location / {
              proxy_pass http://thehive:9000;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              add_header Strict-Transport-Security "max-age=31536000" always;
          }
      }

      server {
          listen 9443 ssl default_server;
          http2 on;
          server_name _;

          ssl_certificate     /etc/nginx/certs/server.crt;
          ssl_certificate_key /etc/nginx/certs/server.key;
          ssl_protocols       TLSv1.2 TLSv1.3;

          client_max_body_size 2G;
          proxy_buffering off;
          proxy_read_timeout 600;

          location / {
              proxy_pass http://cortex:9001;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }
      }

volumes:
  thehivedata:
  cassandradata:
  elasticsearchdata:
  cortexlogs:
  secrets:
  certs:

networks:
  SOC_NET:
    driver: bridge
