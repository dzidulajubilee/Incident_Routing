# TheHive 6 + Cortex 4 lab stack
# 1. cp .env.example .env and set THEHIVE_SECRET (openssl rand -hex 32) and SERVER_NAME
# 2. ./nginx/gen-selfsigned.sh <SERVER_NAME>   (or put your own server.crt/server.key in nginx/certs/)
# 3. sudo sysctl -w vm.max_map_count=262144
# 4. docker compose up -d
# TheHive: https://<SERVER_NAME>       (admin@thehive.local / secret - change it)
# Cortex:  https://<SERVER_NAME>:9443  (create the admin account on first visit)
# TheHive and Cortex are only reachable through nginx.

services:
  thehive:
    image: strangebee/thehive:${THEHIVE_VERSION:-6.0.0-2}
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - JAVA_OPTS=-Xms1280M -Xmx1280M -XX:MaxMetaspaceSize=400m -XX:ReservedCodeCacheSize=250m
    command:
      - --secret
      - ${THEHIVE_SECRET:?Set THEHIVE_SECRET in .env}
      - --cql-hostnames
      - cassandra
      - --es-hostnames
      - elasticsearch
      - --storage-directory
      - /data/files
      # After creating a Cortex org + user for TheHive, add its API key to .env and uncomment:
      # - --cortex-hostnames
      # - cortex
      # - --cortex-keys
      # - ${CORTEX_API_KEY}
    volumes:
      - thehivedata:/data/files
    networks:
      - SOC_NET

  cassandra:
    image: cassandra:${CASSANDRA_VERSION:-4.1.12}
    restart: unless-stopped
    environment:
      - CASSANDRA_CLUSTER_NAME=TheHive
      - CASSANDRA_NUM_TOKENS=4
      - MAX_HEAP_SIZE=1024M
      - HEAP_NEWSIZE=256M
    volumes:
      - cassandradata:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      start_period: 120s
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - SOC_NET

  elasticsearch:
    image: elasticsearch:${ELASTICSEARCH_VERSION:-8.19.25}
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.name=hive
      - http.host=0.0.0.0
      - thread_pool.search.queue_size=100000
      - thread_pool.write.queue_size=100000
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearchdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cat/health || exit 1"]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - SOC_NET

  cortex:
    image: thehiveproject/cortex:${CORTEX_VERSION:-4.2.0}
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - es_uri=http://elasticsearch:9200
      - job_directory=/tmp/cortex-jobs
      - docker_job_directory=/tmp/cortex-jobs
    volumes:
      # Cortex runs analyzers/responders as Docker containers
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/cortex-jobs:/tmp/cortex-jobs
      - cortexlogs:/var/log/cortex
    networks:
      - SOC_NET

  nginx:
    image: nginx:${NGINX_VERSION:-1.31.9}
    restart: unless-stopped
    depends_on:
      - thehive
      - cortex
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:9443:9443"
    networks:
      - SOC_NET

volumes:
  thehivedata:
  cassandradata:
  elasticsearchdata:
  cortexlogs:

networks:
  SOC_NET:
    driver: bridge
